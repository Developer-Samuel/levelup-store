# ──────────────────────────────────────────────────────────────────────────────────────────────
# 🧱 Build & Runtime Base Configuration
# ──────────────────────────────────────────────────────────────────────────────────────────────

x-app-base: &app-base
  build:
    context: ./docker
    dockerfile: Dockerfile
  working_dir: /var/www
  volumes:
    - .:/var/www:delegated
    - ./var:/var/www/var:cached
    - ./vendor:/var/www/vendor:cached
    - ./node_modules:/var/www/node_modules:cached
  networks:
    - app-network
  logging:
    driver: 'json-file'
    options:
      max-size: '10m'
      max-file: '3'

# ──────────────────────────────────────────────────────────────────────────────────────────────
# 🛢️ Database & Cache Environment Settings
# ──────────────────────────────────────────────────────────────────────────────────────────────

# Database Settings
x-env-database: &env-database
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT}
  DB_DATABASE: ${DB_DATABASE}
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}

# Postgres Database Settings
x-postgres-database: &env-postgres-database
  POSTGRES_DB: ${DB_DATABASE}
  POSTGRES_USER: ${DB_USERNAME}
  POSTGRES_PASSWORD: ${DB_PASSWORD}

# Redis Settings
x-env-redis: &env-redis
  REDIS_HOST: ${REDIS_HOST}
  REDIS_PORT: ${REDIS_PORT}

# ──────────────────────────────────────────────────────────────────────────────────────────────
# 🌍 Application-Wide Environment
# ──────────────────────────────────────────────────────────────────────────────────────────────

# Application environment settings
x-app-environment: &app-environment
  APP_ENV: local
  TZ: Europe/Bratislava
  <<:
    - *env-database
    - *env-redis

# ──────────────────────────────────────────────────────────────────────────────────────────────
# ⚙️ Health Check Configuration
# ──────────────────────────────────────────────────────────────────────────────────────────────

# 🩺 App health check
x-healthcheck: &app-healthcheck
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 5s

# ──────────────────────────────────────────────────────────────────────────────────────────────
# 🚦 Resource Allocation per App Container
# ──────────────────────────────────────────────────────────────────────────────────────────────

# 🛢️ App deploy
x-app-deploy: &app-deploy
  resources:
    limits:
      cpus: '4.0'
      memory: 4G
    reservations:
      cpus: '1.0'
      memory: 1G

# ──────────────────────────────────────────────────────────────────────────────────────────────
# 🔧 Service Blueprints (for Actual Deployables)
# ──────────────────────────────────────────────────────────────────────────────────────────────

# PostgreSQL 17 Blueprint
x-service-postgres: &service-postgres
  image: postgres:17
  container_name: levelup_store_postgres
  environment:
    <<: *env-postgres-database
  volumes:
    - pg_data:/var/lib/postgresql/data
  ports:
    - '${DB_PORT}:5432'
  restart: unless-stopped
  networks:
    - app-network
  healthcheck:
    test: ['CMD-SHELL', 'pg_isready -h localhost -U postgres']
    <<: *app-healthcheck

# Redis (latest) Blueprint
x-service-redis: &service-redis
  image: redis:latest
  container_name: levelup_store_redis
  ports:
    - '${REDIS_PORT}:6379'
  volumes:
    - redis_data:/data
    - ./docker/redis/config/redis.conf:/usr/local/etc/redis/config/redis.conf
  restart: unless-stopped
  networks:
    - app-network
  command: ['redis-server', '/usr/local/etc/redis/config/redis.conf']
  healthcheck:
    test: ['CMD', 'redis-cli', 'ping']
    <<: *app-healthcheck

# PHP main container
x-service-app: &service-app
  container_name: levelup_store_app
  command: []
  <<: *app-base
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  environment:
    <<: *app-environment
  deploy:
    <<: *app-deploy

# Setup container (dependencies install, tests, migrations, seeds, etc.)
x-service-app-setup: &service-app-setup
  container_name: levelup_store_app_setup
  profiles: ['setup']
  command: ['setup']
  <<: *app-base
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  environment:
    <<: *app-environment
  deploy:
    <<: *app-deploy

# Cron / Scheduler Service (The 15-minute automation)
x-service-cron: &service-cron
  <<: *app-base
  container_name: levelup_store_cron
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  environment:
    <<: *app-environment
  entrypoint: ["/usr/local/bin/scripts/entrypoints/app/cron/run-cron.sh"]

# Nginx as a webserver proxy for the app
x-service-webserver: &service-webserver
  container_name: levelup_store_nginx
  volumes:
    - .:/var/www:delegated
    - ./docker/nginx/config:/etc/nginx/conf.d
  ports:
    - '8000:80'
  dns: 8.8.8.8
  build:
    context: ./docker/nginx
    dockerfile: Dockerfile.nginx
  depends_on:
    - app
  networks:
    - app-network

# Vite (frontend builder)
x-service-vite: &service-vite
  container_name: levelup_store_vite
  profiles: ['dev']
  build:
    context: ./docker/vite
    dockerfile: Dockerfile.vite
  working_dir: /var/www
  volumes:
    - ./:/var/www
  ports:
    - '5173:5173'
  networks:
    - app-network
  depends_on:
    - app

# Adminer (latest) Blueprint
x-service-adminer: &service-adminer
  image: adminer:latest
  container_name: levelup_store_adminer
  restart: unless-stopped
  ports:
    - '8080:8080'
  environment:
    ADMINER_DEFAULT_DB_DRIVER: pgsql
  networks:
    - app-network

# Prometheus (latest) Blueprint
x-service-prometheus: &service-prometheus
  image: prom/prometheus:latest
  container_name: levelup_store_prometheus
  restart: unless-stopped
  volumes:
    - ./docker/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
    - prometheus_data:/prometheus
  ports:
    - '${PROMETHEUS_PORT}:9090'
  networks:
    - app-network

# Grafana (latest) Blueprint
x-service-grafana: &service-grafana
  image: grafana/grafana:latest
  container_name: levelup_store_grafana
  restart: unless-stopped
  user: '472'
  volumes:
    - ./docker/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
    - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    - ./docker/grafana/provisioning/dashboards:/var/lib/grafana/dashboards:ro
    - grafana_data:/var/lib/grafana
  ports:
    - '${GRAFANA_PORT}:3000'
  networks:
    - app-network
  depends_on:
    - prometheus

# ──────────────────────────────────────────────────────────────────────────────────────────────
# 🚀 Final Service Wiring (The Actual Boot Order)
# ──────────────────────────────────────────────────────────────────────────────────────────────

services:
  # PostgreSQL Service
  postgres:
    <<: *service-postgres

  # Redis Service
  redis:
    <<: *service-redis

  # PHP Service
  app:
    <<: *service-app

  # PHP Setup Service (runs dependencies install, tests, migrations, seeds, etc.)
  app_setup:
    <<: *service-app-setup

  # Cron / Scheduler Service
  cron:
    <<: *service-cron

  # Nginx Service
  webserver:
    <<: *service-webserver

  # Vite Service
  vite:
    <<: *service-vite

  # Adminer Service
  adminer:
    <<: *service-adminer

  # Prometheus Service
  prometheus:
    <<: *service-prometheus

  # Grafana Service
  grafana:
    <<: *service-grafana

# ──────────────────────────────────────────────────────────────────────────────────────────────
# 🕸️ Networks & Volumes
# ──────────────────────────────────────────────────────────────────────────────────────────────

networks:
  app-network:
    driver: bridge

volumes:
  pg_data:
    driver: local
  #mysql_data:
  #driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
