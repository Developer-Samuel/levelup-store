name: 🔍 LevelUp Store Pull Request

on:
  pull_request:
    branches: [main]

concurrency:
  group: pull-request-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.3'
  NODE_VERSION: '22'

jobs:
  # ─── PHP Static Analysis & Linting ────────────────────────────────────────
  php-checks:
    name: 🧹 PHP Lint & Static Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/php
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: PHPStan
        run: composer php-stan

      - name: PHP Mess Detector
        run: composer php-md

      - name: Prepare environment
        run: cp .env.example .env

      - name: Lint Twig
        run: php bin/console lint:twig templates/

      - name: Lint YAML
        run: php bin/console lint:yaml config/

      - name: Lint Container
        run: php bin/console lint:container

  # ─── Architecture Check ───────────────────────────────────────────────────
  deptrac:
    name: 🏗️ Architecture
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/php
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: Run Deptrac
        run: |
          composer deptrac

  # ─── Assets Lint & Type Check ─────────────────────────────────────────────
  lint-assets:
    name: 🎨 Assets Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/node
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: TypeScript type check
        run: pnpm type-check

      - name: ESLint
        run: pnpm lint

      - name: Stylelint
        run: pnpm lint-scss

  # ─── PHPUnit Tests ────────────────────────────────────────────────────────
  phpunit:
    name: 🧪 PHPUnit (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 1
      matrix:
        php-version: ['8.2', '8.3']

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: levelup_store_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/postgres
        with:
          db-name: levelup_store_test
          db-port: '5432'
          db-password: ${{ secrets.POSTGRES_PASSWORD }}

      - uses: ./.github/actions/redis
        with:
          redis-port: '6379'

      - uses: ./.github/actions/env
        with:
          source: .env.test

      - uses: ./.github/actions/php
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo_pgsql, redis, xdebug
          coverage: xdebug

      - name: Database warmup
        run: |
          php bin/console doctrine:database:create --if-not-exists --env=test
          php bin/console doctrine:migrations:migrate --no-interaction --env=test

      - name: Run PHPUnit
        run: composer php-unit

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: phpunit-reports-php${{ matrix.php-version }}
          path: var/tools/phpunit

  # ─── Vitest Frontend Tests ────────────────────────────────────────────────
  vitest:
    name: ⚡ Vitest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/node
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run Vitest
        run: pnpm vitest

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: vitest-coverage
          path: var/tools/vitest
